name: Update for new Minecraft version

on:
  workflow_dispatch:
    inputs:
      dont_recurse:
        description: "Do not call itself recursively"
        type: boolean
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  actions: write

jobs:
  update-datapack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Try updating datapack
        id: update
        run: |
          set -euo pipefail
          previousVersion=$(cat minecraft-version)
          nix --quiet run github:oake/nix-things#mc-datapack-generator -- --previous-version "$previousVersion" --out "./datapack/" >> "$GITHUB_OUTPUT"

      - name: Set new version
        if: steps.update.outputs.version != 'none'
        run: |
          echo "${{ steps.update.outputs.version }}" > minecraft-version

      - name: Commit, tag and push new version
        if: steps.update.outputs.version != 'none'
        id: commit
        uses: EndBug/add-and-commit@v10
        with:
          author_name: Anna Oake
          author_email: anna@oa.ke
          message: update for Minecraft ${{ steps.update.outputs.version }}

      - name: Archive the release
        if: steps.update.outputs.version != 'none'
        run: |
          mkdir -p dist && (cd datapack && zip -r "../dist/tags-smeltable-items-${{ steps.update.outputs.version }}.zip" .)

      - name: Publish on GitHub
        if: steps.update.outputs.version != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.update.outputs.version }}
          target_commitish: ${{ steps.commit.outputs.commit_long_sha }}
          files: dist/tags-smeltable-items-${{ steps.update.outputs.version }}.zip
          body: Support Minecraft ${{ steps.update.outputs.version }}

      - name: Publish on Modrinth
        if: steps.update.outputs.version != 'none'
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: aiNJVJ5Q
          version: ${{ steps.update.outputs.version }}
          loaders: datapack
          game-versions: ${{ steps.update.outputs.version }}
          files: dist/tags-smeltable-items-${{ steps.update.outputs.version }}.zip
          changelog: Support Minecraft ${{ steps.update.outputs.version }}

      - name: Run itself again
        if: steps.update.outputs.version != 'none' && !inputs.dont_recurse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "${{ github.workflow }}" \
            --ref "main"
